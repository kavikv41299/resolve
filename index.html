   const tone=a.createOscillator(),volume=a.createGain();
   tone.type='sine';tone.frequency.value=frequency;
   volume.gain.setValueAtTime(0.0001,start+offset);

   volume.gain.exponentialRampToValueAtTime(0.0001,start+offset+0.14);
   tone.connect(volume);volume.connect(a.destination);

async function loadReassignmentAgents(id){
  const target=document.getElementById('reassign-candidates');
  if(!target)return;
  target.textContent='Checking available agents…';
  try{
    const {data,error}=await api().rpc('eligible_reassignment_agents');
    if(error)throw error;
    if(!document.getElementById('reassign-candidates'))return;
    const c=state.cases.find(x=>x.id===id);
    const agents=(data||[]).filter(a=>a.agent_id!==c?.assigned_to);
    if(!agents.length){
      target.innerHTML='<div class="notice">No other available agents have spare chat capacity. You can retry when an agent becomes available.</div>';
      return;
    }
    target.innerHTML=`<form onsubmit="submitReassignment(event,'${id}')">
      <label for="target-agent">Available Technical Support agents</label>
      <select id="target-agent" required>
        <option value="">Select an agent…</option>
        ${agents.map(a=>`<option value="${e(a.agent_id)}">${e(a.display_name)} (${e(a.username)}) · ${Number(a.active_chats)}/${Number(a.max_chats)} chats</option>`).join('')}
      </select>
      <p id="reassign-error" class="small" role="alert" style="color:#b52b45"></p>
      <button type="submit" class="btn" style="margin-top:12px">Confirm reassignment</button>
    </form>`;
  }catch(err){
    target.textContent='Could not load available agents: '+(err?.message||String(err));
  }
}

async function submitReassignment(ev,id){
  ev.preventDefault();
  if(state.me?.role!=='manager')return;
  const select=document.getElementById('target-agent');
  const agentId=select?.value;
  const message=document.getElementById('reassign-error');
  if(!agentId){if(message)message.textContent='Select an agent first.';return}
  const button=ev.target.querySelector('button[type="submit"]');
  if(button)button.disabled=true;
  try{
    const {error}=await api().rpc('reassign_case',{p_case_id:id,p_agent_id:agentId});
    if(error)throw error;
    document.getElementById('overlay')?.remove();
    state.alert='';
    await refresh();
  }catch(err){
    if(message)message.textContent=err?.message||String(err);
    if(button)button.disabled=false;
  }
}

async function deleteKnowledge(id){

  const guide=state.articles.find(a=>a.id===id&&!a.deleted_at);
  if(!guide)return;
  const warning=`Delete the troubleshooting guide “${guide.title}”?\n\nUnused guides will be permanently deleted. Guides linked to completed conversations will be archived (hidden from new requests) to preserve their history.\n\nGuides currently being used in open conversations cannot be deleted.`;

    state.alert='';

async function loadReportCases(){
 if(state.me?.role!=='manager')return;
 state.reportCases=null;state.reportLoading=true;state.alert='';render();
 try{
  const bounds=reportBounds();
  const rows=[];
  for(let offset=0;;offset+=500){
   let q=api().from('cases').select('*').order('created_at',{ascending:false}).range(offset,offset+499);
   if(bounds.start)q=q.gte('created_at',bounds.start);
   if(bounds.end)q=q.lt('created_at',bounds.end);
   const r=await q;if(r.error)throw r.error;
   rows.push(...(r.data||[]));if((r.data||[]).length<500)break;
  }
  state.reportCases=rows;
 }catch(err){state.alert=err.message||String(err);state.reportCases=null;}
 finally{state.reportLoading=false;render()}
}
async function setReportRange(v){
 state.reportRange=v;
 if(v==='custom'&&(!state.reportStart||!state.reportEnd)){
  const today=new Date();const start=new Date(today.getFullYear(),today.getMonth(),today.getDate()-6);
  state.reportStart=localDateISO(start);state.reportEnd=localDateISO(today);
 }
 await loadReportCases();
}
async function applyReportDates(){

 const to=document.getElementById('reportEnd')?.value||'';
 if(!from||!to||from>to){state.alert='Choose valid From and To dates, with From on or before To.';render();return;}
 state.reportStart=from;state.reportEnd=to;state.reportRange='custom';
 await loadReportCases();
}

 <div class="card" style="margin-top:16px"><h3>Individual agent performance</h3><div class="tablewrap"><table><thead><tr><th>Agent</th><th>Assigned</th><th>Resolved</th><th>Active</th><th>Average resolution</th></tr></thead><tbody>${agents.map(p=>{const assigned=cs.filter(c=>c.assigned_to===p.id),closed=assigned.filter(c=>c.status==='resolved'),times=closed.map(resolveMs).filter(x=>x!=null);return `<tr><td>${e(name(p.id))}</td><td>${assigned.length}</td><td>${closed.length}</td><td>${assigned.filter(c=>c.status==='assigned').length}</td><td>${avg(times)}</td></tr>`}).join('')}</tbody></table></div></div>

const csv=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};function downloadCsv(filename,rows){const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function currentReportCases(){
 if(state.reportCases!==null)return state.reportCases;
 if(state.reportLoading)throw Error('Report is still loading. Please try again when the selected date range has loaded.');
 await loadReportCases();
 if(state.reportCases===null)throw Error('Report data not available');
 return state.reportCases;
}
function reportFileSuffix(){return reportLabel().replace(/[^0-9a-z-]/gi,'_')}

  const rows=[['ID','Created','Field username','Field name','Subject','Article ID','Status','Assigned agent','Queued at','Assigned at','Resolved at','Field reported fixed at','Queue wait seconds','Resolution seconds','Resolution note'],
  ...cases.map(c=>[c.id,c.created_at,state.profiles.find(p=>p.id===c.field_id)?.username||c.field_id,name(c.field_id),c.subject,c.article_id,c.status,name(c.assigned_to),c.queued_at,c.assigned_at,c.resolved_at,c.field_reports_fixed_at,queueMs(c)==null?'':Math.round(queueMs(c)/1000),resolveMs(c)==null?'':Math.round(resolveMs(c)/1000),c.resolution])];
  downloadCsv('resolve-conversations-'+reportFileSuffix()+'.csv',rows);

async function exportTranscripts(){
 if(state.me.role!=='manager')return;
 try{
  const cases=await currentReportCases();
  const messages=[];
  const ids=cases.map(c=>c.id);
  // Read only the messages belonging to conversations in this date range.
  // Multiple pages per batch prevent the default Supabase 1,000-row cap.
  for(let k=0;k<ids.length;k+=100){
   const batch=ids.slice(k,k+100);
   for(let offset=0;;offset+=500){
    const r=await api().from('messages').select('*').in('case_id',batch).order('id',{ascending:true}).range(offset,offset+499);
    if(r.error)throw r.error;
    messages.push(...(r.data||[]));
    if((r.data||[]).length<500)break;
   }
  }
  const map=new Map(cases.map(c=>[c.id,c]));
  const rows=[['Case ID','Issue','Case created','Case status','Message ID','Timestamp','Sender','Sender type','Message'],
  ...messages.map(m=>[m.case_id,map.get(m.case_id)?.subject,map.get(m.case_id)?.created_at,map.get(m.case_id)?.status,m.id,m.created_at,m.author_id?name(m.author_id):'Resolve assistant',m.author_kind,m.body])];
  downloadCsv('resolve-full-transcripts-'+reportFileSuffix()+'.csv',rows);
 }catch(err){fail(err)}
}

 if(!/^[0-9]{6}$/.test(pin))throw Error('PIN must contain exactly six digits');

 state.alert='Account created for '+username+'. Share the temporary PIN privately.';await refresh();
 }catch(err){fail(err)}
}
async function resetPinPrompt(id){
 if(state.me.role!=='manager')return;
 const p=state.profiles.find(x=>x.id===id);if(!p)return;
 const pin=prompt('Enter a new temporary six-digit PIN for '+p.display_name+':');
 if(pin===null)return;
 if(!/^[0-9]{6}$/.test(pin)){state.alert='PIN must contain exactly six digits.';render();return}
 if(!confirm('Reset the PIN for '+p.display_name+'? They must change it at next login.'))return;
 try{await invokeAccounts({action:'reset_pin',user_id:id,password:pin});state.alert='Temporary PIN reset for '+p.display_name;await refresh()}catch(err){fail(err)}
}
async function restoreFormerName(id){
 if(state.me?.role!=='manager')return;
 const p=state.profiles.find(x=>x.id===id);
 if(!formerProfile(p))return;
 const newName=prompt('Enter the original full name of this former colleague:',p.display_name==='Former colleague'?'':p.display_name);
 if(newName===null)return;
 const clean=newName.trim();
 if(clean.length<2||clean.length>100){state.alert='Please enter a name between 2 and 100 characters.';render();return;}
 if(!confirm('Show '+clean+' in historical chats, reports and agent records?'))return;
 try{await invokeAccounts({action:'restore_name',user_id:id,display_name:clean});state.alert='Historical name saved: '+clean;await refresh();}
 catch(err){fail(err)}
}
async function deleteAccount(id){
 if(state.me.role!=='manager'||id===state.me.id)return;
 const p=state.profiles.find(x=>x.id===id);if(!p)return;
 const typed=prompt('Delete login for '+p.display_name+'? Type the username '+p.username+' to confirm.\n\nExisting conversation history will be retained.');
 if(typed!==p.username)return;
 try{await invokeAccounts({action:'delete',user_id:id});state.alert='Access removed for '+p.username;await refresh()}catch(err){fail(err)}
}

(async()=>{try{
  if(!window.supabase){state.alert='Supabase could not load. Check your connection and refresh this page.';return;}
  if(!CONFIG.url.startsWith('https://')||CONFIG.anon.startsWith('REPLACE_')){
    state.alert='Supabase project settings are incomplete.';return;
  }
  state.client=window.supabase.createClient(CONFIG.url,CONFIG.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data,error}=await state.client.auth.getSession();
  if(error)throw error;
  if(data.session){state.user=data.session.user;await initSession();return;}
 }catch(err){state.alert=err.message||String(err);state.user=null;state.me=null;home();}
})();
