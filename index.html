/* Verisure portal theme — the default is deliberately light / white */

/* Field request cooldown + agent-verified resolution + reporting date filters */
.cooldown-notice{border:1px solid #b8cefa;background:#edf4ff;color:#255083;border-radius:12px;padding:13px 15px;margin:14px 0;font-size:13px}
.cooldown-notice.ready{border-color:#b8e1c9;background:#ecfaf1;color:#216748}
/* Live conversations: date range controls share the reporting layout. */
.inbox-filterbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:0 0 15px}
.inbox-filterbar .field{display:flex;flex-direction:column;min-width:135px;flex:1;max-width:195px}
.inbox-filterbar .field label{margin:0 0 5px}
.inbox-filterbar select{max-width:195px}
.inbox-filterbar input{width:100%}
.inbox-filterbar .btn{white-space:nowrap}
.inbox-filtermeta{margin:-1px 0 14px;color:#65758f;font-size:12px}
.inbox-filtermeta strong{font-weight:700}
.inbox-filtermeta .date-error{color:#af3040;font-weight:650}
@media(max-width:700px){.inbox-filterbar .field{min-width:calc(50% - 12px);max-width:none}.inbox-filterbar select{max-width:none}.inbox-filterbar .btn{flex:1}}
.report-dates{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:12px 0 17px}
.report-dates label{margin:0 0 5px}
.report-dates input{max-width:180px}
.report-dates .field{display:flex;flex-direction:column;min-width:145px}
.report-explanation{font-size:12px;color:var(--muted,#6b778b);margin-bottom:15px}
@media(max-width:620px){.report-dates .field{flex:1;min-width:125px}.report-dates input{width:100%;max-width:none}}

/* Agent availability picker (manager reassignment) */
.reassign-modal{width:min(540px,100%);max-height:90dvh;overflow-y:auto}
.reassign-modal select{width:100%}
.reassign-modal .notice{line-height:1.55}
@media(max-width:620px){.reassign-modal{padding:18px}}

/* Resolve 007: unread Field messages in assigned agent conversations */
.caseitem.has-unread{border:2px solid #2458e6!important;border-left:6px solid #2458e6!important;background:#ebf2ff!important;box-shadow:0 0 0 2px #2b63fa19;position:relative}
.caseitem.has-unread:hover{background:#e0ecff!important}
.caseitem .caseitem-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.caseitem .caseitem-title b{min-width:0;overflow-wrap:anywhere}
.unread-label{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:#2359e8;color:#fff;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.unread-pulse{width:7px;height:7px;background:#fff;border-radius:50%;box-shadow:0 0 0 3px #ffffff45;flex-shrink:0}
.nav-unread{display:inline-block;border-radius:999px;min-width:21px;margin-left:6px;padding:2px 7px;background:#e11e49;color:#fff;text-align:center;font-size:11px;font-weight:800;vertical-align:middle}
.notification-toggle{white-space:nowrap;font-size:12px}
.unread-help{color:#4a617e;font-size:12px;margin:0 0 12px}
[data-theme="dark"] .caseitem.has-unread{border-color:#78a1ff!important;background:#213a60!important;box-shadow:0 0 0 2px #7ba6ff22}
[data-theme="dark"] .caseitem.has-unread:hover{background:#284972!important}
[data-theme="dark"] .unread-help{color:#b8c8df}
@media(max-width:620px){.notification-toggle{padding:7px 8px;font-size:11px}.unread-label{font-size:10px}}

/* Resolve overview: UK-local Live Today and historical date filters */
.overview-filter{padding:16px 18px;margin-bottom:17px}
.overview-filter-row{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.overview-filter-heading{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.overview-filter-heading strong{font-size:15px}
.overview-filter .overview-filter-desc{margin:0;color:var(--muted,#6b778b);font-size:12px}
.overview-controls{display:flex;align-items:end;gap:9px;flex-wrap:wrap}
.overview-controls label{display:block;margin:0 0 5px;font-size:11px;color:var(--muted,#6b778b)}
.overview-controls input[type="date"]{width:148px;min-width:125px;padding:8px 10px;min-height:39px}
.overview-controls .btn{min-height:39px;white-space:nowrap}
.overview-live-btn{border-color:#b1dfcb!important;color:#136344!important;background:#eaf8f0!important}
.overview-live-btn.active{background:#137954!important;border-color:#137954!important;color:white!important}
.overview-live-dot{display:inline-block;width:8px;height:8px;background:currentColor;border-radius:99px;margin-right:5px}
.overview-period{font-size:12px;color:var(--muted,#6b778b);padding-top:11px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.overview-count-note{font-size:12px;color:var(--muted,#6b778b);margin:-4px 0 14px}
.overview-mode-label{background:#e8f6ed;color:#14633e;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700}
.overview-mode-label.history{background:#eaf0ff;color:#315bb7}
[data-theme="dark"] .overview-live-btn{color:#a4e9c6!important;background:#163b32!important;border-color:#3a7e66!important}
[data-theme="dark"] .overview-live-btn.active{background:#218564!important;color:white!important}
[data-theme="dark"] .overview-mode-label{background:#20493b;color:#c9f4dc}
[data-theme="dark"] .overview-mode-label.history{background:#243e68;color:#c9daff}
@media(max-width:750px){.overview-filter-row{align-items:stretch}.overview-controls{width:100%}.overview-controls .overview-date-field{flex:1;min-width:125px}.overview-controls input[type="date"]{width:100%}.overview-controls .btn{flex:1}}

/* Manager-only presence controls */
.agent-presence-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eef2f7}
.agent-presence-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.manager-presence{min-width:110px;max-width:146px;width:auto;padding:7px 26px 7px 10px;border:1px solid #cbd6e7;border-radius:9px;background:var(--surface,#fff);color:inherit;font-size:12px;font-weight:650}

.kb-editor-step-head label{margin:0 0 8px}
.kb-editor-step textarea{display:block;width:100%;min-height:78px;resize:vertical}
.kb-step-buttons{margin-top:15px}
.kb-editor-actions{position:sticky;bottom:-26px;background:white;padding:17px 0 3px;margin-top:14px;border-top:1px solid #e0e7f1}
[data-theme="dark"] .kb-editor-step{background:#20334f;border-color:#3b4f6a}
[data-theme="dark"] .kb-editor-actions{background:#17243b;border-color:#3b4f6a}

.resolve-ui .ui-menu button svg{flex:0 0 21px}.resolve-ui .ui-menu button:hover{color:#fff;background:#ffffff12}.resolve-ui .ui-menu button.active{color:white;background:linear-gradient(95deg,#e90030,#d80030);box-shadow:0 7px 20px #d5003142;font-weight:740}

async function playNewMessageSound(force=false){

 const time=Date.now();if(!force&&time-state.lastSoundAt<1200)return false;
 try{
  if(!(await unlockNotificationAudio()))return false;
  const ctx=state.audioContext, start=ctx.currentTime+0.025;
  for(const [offset,frequency] of [[0,740],[0.16,990]]){
   const tone=ctx.createOscillator(),volume=ctx.createGain();
   tone.type='sine';tone.frequency.value=frequency;
   volume.gain.setValueAtTime(0.0001,start+offset);
   volume.gain.exponentialRampToValueAtTime(0.13,start+offset+0.015);
   volume.gain.exponentialRampToValueAtTime(0.0001,start+offset+0.16);
   tone.connect(volume);volume.connect(ctx.destination);
   tone.start(start+offset);tone.stop(start+offset+0.18);

// First request sets a baseline; subsequent requests only fetch newer messages.
// No historic messages are treated as a newly arrived alert on sign-in.
async function scanIncomingFieldMessages(){
 if(!canReceiveMessageAlerts()||!state.user||state.scanBusy)return;
 state.scanBusy=true;
 try{
  if(state.scanCursor===null){
   const {data,error}=await api().from('messages')
    .select('id').eq('author_kind','field').order('id',{ascending:false}).limit(1);
   if(error)throw error;
   state.scanCursor=Number(data?.[0]?.id||0);
   state.scanPrimed=true;
   return;
  }
  const {data,error}=await api().from('messages')
   .select('id,case_id,author_id,author_kind').eq('author_kind','field')
   .gt('id',state.scanCursor).order('id',{ascending:true}).limit(200);
  if(error)throw error;
  for(const message of data||[]){
   state.scanCursor=Math.max(state.scanCursor,Number(message.id)||0);
   notifyIncomingFieldMessage(message,'poll');
  }
  // Any unread increments are reconciled after the scan, even if Realtime is down.
  if(data?.length)void loadUnreadCounts(true);
 }catch(err){
  console.warn('Notification message watcher error:',err.message||String(err));
  state.scanPrimed=false;
 }finally{state.scanBusy=false}
}

async function loadUnreadCounts(force=false){
 if(!canReceiveMessageAlerts()||!state.user)return;
 if(state.unreadLoading){if(force)state.unreadReloadQueued=true;return;}
 if(!force&&Date.now()-state.unreadLastFetch<6500)return;
 state.unreadLoading=true;
 const requestStart=Date.now();
 try{
  const result=await api().rpc('resolve_staff_unread_counts');
  if(result.error)throw result.error;
  const next={};
  for(const row of result.data||[])next[row.case_id]=Math.max(0,Number(row.unread_count)||0);
  const before={...state.unreadCounts};
  const changed=state.unreadReady&&Object.keys(next).some(k=>(next[k]||0)>(before[k]||0));
  state.unreadCounts=next;state.unreadReady=true;state.unreadError='';state.unreadLastFetch=Date.now();
  updateAlertIndicators();
  // Play when a background poll finds unseen messages, unless Realtime already
  // alerted for the same arrival. Never rely on a sound test to prove SQL works.
  if(changed&&Date.now()-(state.lastNotificationEventAt||0)>10000){
   state.lastNotificationEventAt=Date.now();
   void playNewMessageSound();
   const c=Object.keys(next).find(k=>(next[k]||0)>(before[k]||0));
   if(c)showIncomingMessageBanner(c,(next[c]||1));
  }

 }catch(err){
  console.warn('Unread notifications query failed:',err);
  state.unreadError='Unread notifications require the Supabase SQL update 011. '+(err.message||'');
  const notice=document.querySelector('[data-unread-error]');if(notice)notice.textContent=state.unreadError;
  updateAlertIndicators();
 }finally{
  state.unreadLoading=false;
  if(state.unreadReloadQueued){state.unreadReloadQueued=false;setTimeout(()=>void loadUnreadCounts(true),150)}
 }
}

function scoredArticles(question){const q=String(question||'').toLowerCase();const words=q.match(/[a-z0-9]{3,}/g)||[];return state.articles.filter(a=>a.active).map(a=>{const title=a.title.toLowerCase(),keys=(a.keywords||'').toLowerCase().split(/[,;\s]+/).filter(x=>x.length>2);let score=(q.includes(title)?15:0);for(const w of words){if(title.includes(w))score+=3;if(keys.includes(w))score+=5;}return {a,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)}
function showSuggestion(){
 const question=document.getElementById('subject')?.value||'';
 const matches=scoredArticles(question),pick=document.getElementById('article'),hint=document.getElementById('matchHint');
 if(!pick||!hint)return;
 const unmatchedOption=pick.querySelector('option[value=""]');
 if(unmatchedOption)unmatchedOption.disabled=matches.length>0;
 if(matches.length){
  // Do not offer an early bypass when the question matches an approved guide.
  if(pick.dataset.manual!=='1'||!pick.value)pick.value=matches[0].a.id;
  hint.textContent='Please follow the approved troubleshooting steps. If none fixes the issue, Resolve automatically escalates to Technical Support.';
 }else{
  if(pick.dataset.manual!=='1')pick.value='';
  hint.textContent='No approved guide matches this question. Resolve will automatically queue it for Technical Support.';
 }
}

async function createCase(ev){

 if(requestWaitMs()>0){state.alert='Please wait '+countdownText(requestWaitMs())+' before opening another request.';render();return;}
 const submit=document.getElementById('requestSubmit');if(submit)submit.disabled=true;
 try{
  const subject=document.getElementById('subject').value.trim();
  const selectedArticleId=document.getElementById('article').value;
  const aid=selectedArticleId&&state.steps.some(s=>s.article_id===selectedArticleId)?selectedArticleId:null;
  const r=await api().rpc('create_case',{p_subject:subject,p_article_id:aid});
  if(r.error)throw r.error;
  state.selected=r.data;
  await refresh(false);
  state.tab='conversations';state.alert='';render();
 }catch(err){if(submit)submit.disabled=false;fail(err)}
}

async function submitReassignment(ev,id){

  if(!agentId){if(message)message.textContent='Select an agent first.';return}
  const button=ev.target.querySelector('button[type="submit"]');
  if(button)button.disabled=true;
  try{
    const {error}=await api().rpc('reassign_case',{p_case_id:id,p_agent_id:agentId});

    if(message)message.textContent=err?.message||String(err);
    if(button)button.disabled=false;
  }
}

// Knowledge Base CSV: one row per troubleshooting guide; each step has its own Excel column.
// Exports fetch every readable row from Supabase rather than relying on the first page in state.
const KB_CSV_BASE=['title','keywords','active'];
const KB_CSV_STEPS=Array.from({length:10},(_,i)=>'step_'+(i+1));
const KB_CSV_TEMPLATE_HEADERS=[...KB_CSV_BASE,...KB_CSV_STEPS];
let kbImportPlan=null;
function kbCSVCell(value){
 let str=String(value??'');
 // Prevent Excel from interpreting imported guide text as a formula when exported.
 if(/^[\s\x00-\x1f]*[=+@-]/.test(str))str="'"+str;
 return '"'+str.replace(/"/g,'""')+'"';
}
function kbCSVString(headers,rows){
 return '\uFEFF'+[headers,...rows].map(row=>row.map(kbCSVCell).join(',')).join('\r\n')+'\r\n';
}
function kbCSVDownload(filename,headers,rows){
 const blob=new Blob([kbCSVString(headers,rows)],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');link.href=url;link.download=filename;
 document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function kbDownloadTemplate(){
 kbCSVDownload('Resolve_Knowledge_Base_Blank_Template.csv',KB_CSV_TEMPLATE_HEADERS,[]);
}
async function kbFetchEveryRow(table,columns,orderBy){
 const results=[];const pageSize=500;
 for(let start=0;start<100000;start+=pageSize){
  const {data,error}=await api().from(table).select(columns).order(orderBy,{ascending:true}).range(start,start+pageSize-1);
  if(error)throw error;
  const current=data||[];results.push(...current);
  if(current.length<pageSize)return results;
 }
 throw Error('Too many Knowledge Base records. Contact the administrator before exporting.');
}
async function kbExportAll(){
 if(state.me?.role!=='manager')return;
 const control=document.querySelector('.kb-import-export-actions button');
 if(control){control.disabled=true;control.textContent='Exporting…';}
 try{
  const [articles,steps]=await Promise.all([
   kbFetchEveryRow('articles','id,title,keywords,active,created_at,deleted_at','id'),
   kbFetchEveryRow('article_steps','id,article_id,ordinal,instructions','id')
  ]);
  const byGuide=new Map();
  for(const step of steps){if(!byGuide.has(step.article_id))byGuide.set(step.article_id,[]);byGuide.get(step.article_id).push(step);}
  const maxSteps=Array.from(byGuide.values()).reduce((max,items)=>Math.max(max,items.length),10);
  const headers=[...KB_CSV_BASE,'archived','guide_id','created_at',...Array.from({length:maxSteps},(_,i)=>'step_'+(i+1))];
  const rows=articles.map(article=>{
   const ordered=(byGuide.get(article.id)||[]).sort((a,b)=>a.ordinal-b.ordinal);
   return [article.title,article.keywords||'',article.active?'TRUE':'FALSE',article.deleted_at?'TRUE':'FALSE',article.id,article.created_at||'',...Array.from({length:maxSteps},(_,i)=>ordered[i]?.instructions||'')];
  });
  kbCSVDownload('Resolve_Knowledge_Base_Export_'+new Date().toISOString().slice(0,10)+'.csv',headers,rows);
  state.alert=`Exported ${articles.length} Knowledge Base guides and ${steps.length} troubleshooting steps.`;
  render();
 }catch(err){fail(err);}
 finally{if(control&&control.isConnected){control.disabled=false;control.textContent='Export all CSV';}}
}
function kbParseCSV(source){
 const text=String(source??'').replace(/^\uFEFF/,'');
 const rows=[];let row=[];let cell='';let quoted=false;let afterQuote=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(quoted){
   if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else{quoted=false;afterQuote=true;}}
   else cell+=ch;
  }else if(afterQuote){
   if(ch===','){row.push(cell);cell='';afterQuote=false;}
   else if(ch==='\n'||ch==='\r'){row.push(cell);rows.push(row);row=[];cell='';afterQuote=false;if(ch==='\r'&&text[i+1]==='\n')i++;}
   else if(ch===' '||ch==='\t'){} // Whitespace after a quoted value is permitted.
   else throw Error(`Unexpected character after a closing quote near character ${i+1}.`);
  }else if(ch==='"'){
   if(cell.trim())throw Error(`Unexpected quote near character ${i+1}.`);
   cell='';quoted=true;
  }else if(ch===','){row.push(cell);cell='';}
  else if(ch==='\n'||ch==='\r'){
   row.push(cell);rows.push(row);row=[];cell='';if(ch==='\r'&&text[i+1]==='\n')i++;
  }else cell+=ch;
 }
 if(quoted)throw Error('The CSV has an unfinished quoted cell. Save it as CSV UTF-8 from Excel.');
 if(afterQuote||cell!==''||row.length){row.push(cell);rows.push(row);}
 return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function kbNormaliseImportedCell(value){
 const s=String(value??'').trim();
 // Round-trip safely escaped Excel formula-looking text from our own exports.
 return /^'[=+@-]/.test(s)?s.slice(1):s;
}
function kbCSVBoolean(value,defaultValue=true){
 const v=String(value??'').trim().toLowerCase();
 if(!v)return defaultValue;
 if(['true','yes','1','active','enabled'].includes(v))return true;
 if(['false','no','0','inactive','disabled'].includes(v))return false;
 throw Error('Use TRUE or FALSE in the Active or Archived column.');
}
async function kbChooseImport(event){
 if(state.me?.role!=='manager')return;
 const control=event.target;const file=control.files?.[0];control.value='';
 if(!file)return;
 if(!/\.csv$/i.test(file.name)){alert('Choose a .csv file exported from Excel.');return;}
 if(file.size>5*1024*1024){alert('CSV file is too large (maximum 5 MB).');return;}
 try{
  const records=kbParseCSV(await file.text());
  if(records.length<1)throw Error('The CSV is empty. Use the blank template to get started.');
  if(records.length>2001)throw Error('Maximum 2,000 guides per import. Split the file into smaller CSV files.');
  const headers=records[0].map(x=>String(x).trim().toLowerCase().replace(/^\uFEFF/,''));
  if(new Set(headers).size!==headers.length)throw Error('The CSV has duplicate column names.');
  for(const col of ['title','step_1'])if(!headers.includes(col))throw Error('Missing required CSV column: '+col);
  const extraSteps=headers.filter(h=>/^step_\d+$/.test(h)&&Number(h.slice(5))>10);
  if(extraSteps.length)throw Error('Imports support a maximum of 10 steps. Remove step_11 onwards before importing.');
  if(headers.some(h=>h===''))throw Error('There is a blank column header.');
  const originalRows=records.slice(1);
  // Fetch the server-side titles to avoid inadvertently duplicating existing guides.
  const existing=await kbFetchEveryRow('articles','id,title','id');
  const known=new Set(existing.map(a=>String(a.title||'').trim().toLocaleLowerCase('en-GB')));
  const duplicates=[];const errors=[];const ready=[];let archived=0;
  for(let rowIndex=0;rowIndex<originalRows.length;rowIndex++){
   const values=originalRows[rowIndex];const line=rowIndex+2;
   if(values.length>headers.length){errors.push(`Row ${line}: too many columns.`);continue;}
   const fields={};headers.forEach((h,i)=>fields[h]=kbNormaliseImportedCell(values[i]));
   const title=(fields.title||'').trim();
   if(title.length<3||title.length>200){errors.push(`Row ${line}: title must be 3–200 characters.`);continue;}
   const keywords=fields.keywords||'';
   if(keywords.length>1500){errors.push(`Row ${line}: keywords must be 1,500 characters or fewer.`);continue;}
   let active=true,isArchived=false;
   try{active=kbCSVBoolean(fields.active,true);isArchived=kbCSVBoolean(fields.archived,false);}
   catch(err){errors.push(`Row ${line}: ${err.message}`);continue;}
   const numbered=KB_CSV_STEPS.map(h=>fields[h]||'');
   const last=numbered.reduce((n,s,i)=>s.trim()?i+1:n,0);
   if(last===0){errors.push(`Row ${line}: add at least one troubleshooting step.`);continue;}
   if(numbered.slice(0,last).some(s=>!s.trim())){errors.push(`Row ${line}: fill steps in order without empty gaps.`);continue;}
   const instructions=numbered.slice(0,last).map(x=>x.trim());
   if(instructions.some(s=>s.length>4000)){
    errors.push(`Row ${line}: each step must be 4,000 characters or fewer.`);continue;
   }
   const key=title.toLocaleLowerCase('en-GB');
   if(known.has(key)){duplicates.push(`Row ${line}: ${title}`);continue;}
   known.add(key);
   // Archived guides can be restored as disabled copies, never silently reactivated.
   if(isArchived)archived++;
   ready.push({line,title,keywords,steps:instructions,active:active&&!isArchived,archived:isArchived});
  }
  kbImportPlan={name:file.name,ready,duplicates,errors,archived,total:originalRows.length};
  kbShowImportPreview();
 }catch(err){alert('Cannot read CSV: '+(err.message||String(err)));}
}
function kbShowImportPreview(){
 if(state.me?.role!=='manager'||!kbImportPlan)return;
 const p=kbImportPlan;
 document.getElementById('overlay')?.remove();

async function kbConfirmImport(){
 if(state.me?.role!=='manager'||!kbImportPlan||kbImportPlan.errors.length)return;
 const p=kbImportPlan;
 if(!p.ready.length)return;
 if(!confirm(`Add ${p.ready.length} new guide(s) to the Knowledge Base? Existing guides will not be changed.`))return;
 const button=document.getElementById('kb-import-confirm');if(button)button.disabled=true;
 const status=document.getElementById('kb-import-progress');
 let added=0;const failed=[];
 for(let i=0;i<p.ready.length;i++){
  const row=p.ready[i];
  if(status)status.textContent=`Importing guide ${i+1} of ${p.ready.length}: ${row.title}`;
  try{
   const {data:id,error}=await api().rpc('admin_save_article',{
    p_id:null,p_title:row.title,p_keywords:row.keywords,p_steps:row.steps
   });
   if(error)throw error;
   if(!row.active){
    const change=await api().rpc('admin_set_article_active',{p_id:id,p_active:false});
    if(change.error){
     // Do not leave a requested disabled guide active if the status update fails.
     const cleanup=await api().rpc('admin_delete_article',{p_id:id});
     if(cleanup.error)throw Error(`Guide was created ACTIVE because disabling failed. Please disable it manually now: ${row.title}. ${change.error.message}`);
     throw Error(`The disabled guide could not be saved and was removed: ${change.error.message}`);
    }
   }
   added++;
  }catch(err){failed.push(`Row ${row.line} (${row.title}): ${err.message||String(err)}`);}
 }
 kbImportPlan=null;
 document.getElementById('overlay')?.remove();
 await refresh();
 const details=failed.length?'\n\n'+failed.slice(0,10).join('\n'):'';
 alert(`${added} guide(s) imported. ${p.duplicates.length} duplicate(s) skipped. ${failed.length} failed.${details}`);
}

function updateKbStepControls(){

function addKbStep(){

function removeKbStep(){

async function deleteKnowledge(id){

async function loadReportCases(){
 if(state.me?.role!=='manager')return;
 state.reportCases=null;state.reportLoading=true;state.alert='';render();
 try{
  const bounds=reportBounds();
  const rows=[];
  for(let offset=0;;offset+=500){
   let q=api().from('cases').select('*').order('created_at',{ascending:false}).range(offset,offset+499);
   if(bounds.start)q=q.gte('created_at',bounds.start);
   if(bounds.end)q=q.lt('created_at',bounds.end);
   const r=await q;if(r.error)throw r.error;
   rows.push(...(r.data||[]));if((r.data||[]).length<500)break;
  }
  state.reportCases=rows;
 }catch(err){state.alert=err.message||String(err);state.reportCases=null;}
 finally{state.reportLoading=false;render()}
}

 <div class="tablewrap"><table><thead><tr><th>Created</th><th>Issue</th><th>Field</th><th>Agent</th><th>Status</th><th>Queue wait</th><th>Resolution</th></tr></thead><tbody>${body||'<tr><td colspan="7" class="muted">No conversations in the selected date range.</td></tr>'}</tbody></table></div>`;

const csv=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};function downloadCsv(filename,rows){const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function currentReportCases(){
 if(state.reportCases!==null)return state.reportCases;
 if(state.reportLoading)throw Error('Report is still loading. Please try again when the selected date range has loaded.');
 await loadReportCases();
 if(state.reportCases===null)throw Error('Report data not available');
 return state.reportCases;
}
function reportFileSuffix(){return reportLabel().replace(/[^0-9a-z-]/gi,'_')}
async function exportSummary(){
 if(state.me.role!=='manager')return;
 try{
  const cases=await currentReportCases();
  const rows=[['ID','Created','Field username','Field name','Subject','Article ID','Status','Assigned agent','Queued at','Assigned at','Resolved at','Field reported fixed at','Queue wait seconds','Resolution seconds','Resolution note'],
  ...cases.map(c=>[c.id,c.created_at,state.profiles.find(p=>p.id===c.field_id)?.username||c.field_id,name(c.field_id),c.subject,c.article_id,caseStatusLabel(c.status),name(c.assigned_to),c.queued_at,c.assigned_at,c.resolved_at,c.field_reports_fixed_at,queueMs(c)==null?'':Math.round(queueMs(c)/1000),resolveMs(c)==null?'':Math.round(resolveMs(c)/1000),c.resolution])];
  downloadCsv('resolve-conversations-'+reportFileSuffix()+'.csv',rows);
 }catch(err){fail(err)}
}
async function exportTranscripts(){
 if(state.me.role!=='manager')return;
 try{
  const cases=await currentReportCases();
  const messages=[];
  const ids=cases.map(c=>c.id);
  // Read only the messages belonging to conversations in this date range.
  // Multiple pages per batch prevent the default Supabase 1,000-row cap.
  for(let k=0;k<ids.length;k+=100){
   const batch=ids.slice(k,k+100);
   for(let offset=0;;offset+=500){
    const r=await api().from('messages').select('*').in('case_id',batch).order('id',{ascending:true}).range(offset,offset+499);
    if(r.error)throw r.error;
    messages.push(...(r.data||[]));
    if((r.data||[]).length<500)break;
   }
  }
  const map=new Map(cases.map(c=>[c.id,c]));
  const rows=[['Case ID','Issue','Case created','Case status','Message ID','Timestamp','Sender','Sender type','Message'],
  ...messages.map(m=>[m.case_id,map.get(m.case_id)?.subject,map.get(m.case_id)?.created_at,caseStatusLabel(map.get(m.case_id)?.status),m.id,m.created_at,m.author_id?name(m.author_id):systemMessageSender(m),m.author_kind,m.body])];
  downloadCsv('resolve-full-transcripts-'+reportFileSuffix()+'.csv',rows);
 }catch(err){fail(err)}
}

 <div class="note" style="margin-top:16px">Six-digit PINs on a publicly accessible website are vulnerable to guessing. Require manager MFA, configure Auth rate limits, and obtain your company’s security approval before real use.</div>`;
}
async function invokeAccounts(body){
 const {data,error}=await api().functions.invoke('accounts',{body});
 if(error){let reason=error.message||'Edge Function failed';try{if(error.context&&typeof error.context.json==='function'){const details=await error.context.json();reason=details.error||details.message||reason}}catch{}throw Error(reason)}
 if(data?.error)throw Error(data.error);
 return data;
}
async function createAccount(ev){ev.preventDefault();try{
 const username=document.getElementById('newuser').value.trim(),display_name=document.getElementById('newname').value.trim(),role=document.getElementById('newrole').value,pin=document.getElementById('temppass').value;
 if(!/^[0-9]{6}$/.test(pin))throw Error('PIN must contain exactly six digits');
 await invokeAccounts({action:'create',username,display_name,role,password:pin});
 state.alert='Account created for '+username+'. Share the temporary PIN privately.';await refresh();
 }catch(err){fail(err)}
}
async function resetPinPrompt(id){
 if(state.me.role!=='manager')return;
 const p=state.profiles.find(x=>x.id===id);if(!p)return;
 const pin=prompt('Enter a new temporary six-digit PIN for '+p.display_name+':');
 if(pin===null)return;
 if(!/^[0-9]{6}$/.test(pin)){state.alert='PIN must contain exactly six digits.';render();return}
 if(!confirm('Reset the PIN for '+p.display_name+'? They must change it at next login.'))return;
 try{await invokeAccounts({action:'reset_pin',user_id:id,password:pin});state.alert='Temporary PIN reset for '+p.display_name;await refresh()}catch(err){fail(err)}
}
async function restoreFormerName(id){
 if(state.me?.role!=='manager')return;
 const p=state.profiles.find(x=>x.id===id);
 if(!formerProfile(p))return;
 const newName=prompt('Enter the original full name of this former colleague:',p.display_name==='Former colleague'?'':p.display_name);
 if(newName===null)return;
 const clean=newName.trim();
 if(clean.length<2||clean.length>100){state.alert='Please enter a name between 2 and 100 characters.';render();return;}
 if(!confirm('Show '+clean+' in historical chats, reports and agent records?'))return;
 try{await invokeAccounts({action:'restore_name',user_id:id,display_name:clean});state.alert='Historical name saved: '+clean;await refresh();}
 catch(err){fail(err)}
}
async function deleteAccount(id){
 if(state.me.role!=='manager'||id===state.me.id)return;
 const p=state.profiles.find(x=>x.id===id);if(!p)return;
 const typed=prompt('Delete login for '+p.display_name+'? Type the username '+p.username+' to confirm.\n\nExisting conversation history will be retained.');
 if(typed!==p.username)return;
 try{await invokeAccounts({action:'delete',user_id:id});state.alert='Access removed for '+p.username;await refresh()}catch(err){fail(err)}
}

// Keep the landing page visible even when the network or Supabase CDN fails.
// Use the official Supabase alternative CDN if jsDelivr is blocked by a company network.
function loadSupabaseFallback(){
 if(window.supabase?.createClient)return Promise.resolve(true);
 return new Promise(resolve=>{
   const script=document.createElement('script');
   let finished=false;
   const timeout=setTimeout(()=>finish(false),8000);
   function finish(ok){
     if(finished)return;
     finished=true;
     clearTimeout(timeout);
     if(!ok)script.remove();
     resolve(ok);
   }
   script.src='https://unpkg.com/@supabase/supabase-js@2';
   script.async=true;
   script.onload=()=>finish(Boolean(window.supabase?.createClient));
   script.onerror=()=>finish(false);
   document.head.appendChild(script);
 });
}
home();
(async()=>{try{
  if(!window.supabase?.createClient){
    const loaded=await loadSupabaseFallback();
    if(!loaded)throw Error('Supabase library could not load. Check your internet connection or ask IT to allow jsDelivr or unpkg.');
  }
  if(!CONFIG.url.startsWith('https://')||CONFIG.anon.startsWith('REPLACE_')){
    throw Error('Supabase project settings are incomplete.');
  }
  state.client=window.supabase.createClient(CONFIG.url,CONFIG.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data,error}=await state.client.auth.getSession();
  if(error)throw error;
  if(data.session){state.user=data.session.user;await initSession();return;}
 }catch(err){state.alert=err.message||String(err);state.user=null;state.me=null;home();}
})();
