<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1730"><title>Resolve | Field and Call Centre</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#152843;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.brand{font-weight:850;font-size:24px;letter-spacing:-1px;color:#1d58e7}.muted{color:#718098}.small{font-size:12px}.shell{min-height:100vh}.entry{min-height:100vh;background:radial-gradient(circle at 20% 20%,#234d94,#0b1730 55%);color:white;display:grid;place-items:center;padding:24px}.entry-inner{max-width:1040px;width:100%}.entry .brand{color:white;font-size:30px}.entry h1{font-size:clamp(32px,5vw,64px);letter-spacing:-2px;max-width:750px;line-height:1.07;margin:50px 0 18px}.entry p{color:#b9cbe8;max-width:570px;line-height:1.6}.portals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:36px}.portal{background:#ffffff10;border:1px solid #ffffff35;border-radius:22px;padding:30px;text-align:left;color:white;min-height:200px;transition:.2s}.portal:hover{background:#ffffff22;transform:translateY(-2px)}.portal b{display:block;font-size:23px;margin-top:18px}.portal span{display:block;color:#bdcce1;margin-top:7px;line-height:1.5}.authpage{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eaf0ff,#f9fbff)}.authcard{background:white;border-radius:24px;box-shadow:0 20px 70px #122a5420;padding:32px;width:min(440px,100%)}h2{margin:0 0 16px}label{display:block;font-weight:650;font-size:13px;margin:12px 0 7px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dfed;border-radius:10px;background:white;color:#1a2e4b;outline:0}input:focus,select:focus,textarea:focus{border-color:#4779f6;box-shadow:0 0 0 3px #4779f51c}textarea{min-height:90px;resize:vertical}.btn{background:#275ceb;border:1px solid #275ceb;color:white;padding:11px 16px;border-radius:10px;font-weight:650}.btn.alt{background:white;color:#244266;border-color:#cbd6e7}.btn.soft{background:#eaf0ff;color:#2356c8;border-color:#eaf0ff}.btn.danger{background:#c63a48;border-color:#c63a48}.btn.sm{padding:7px 10px;font-size:12px}.btn.full{width:100%}.top{height:72px;background:white;border-bottom:1px solid #e0e7f0;padding:0 25px;display:flex;justify-content:space-between;align-items:center;gap:10px}.topright{display:flex;gap:10px;align-items:center}.layout{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 72px)}.sidebar{border-right:1px solid #e1e8f2;background:white;padding:20px 12px}.sidebar button{display:block;width:100%;text-align:left;padding:12px 14px;background:none;border:0;border-radius:10px;color:#38516f;margin:3px 0}.sidebar button.active{background:#e9f0ff;color:#1747bf;font-weight:700}.main{padding:28px;min-width:0;max-width:1600px;width:100%;margin:0 auto}.pagehead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}.pagehead h2{margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:white;border:1px solid #e0e7f2;border-radius:17px;padding:18px;box-shadow:0 2px 6px #263a6207}.metric{font-size:30px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:16px}.list{display:flex;flex-direction:column;gap:8px;max-height:65vh;overflow:auto}.caseitem{text-align:left;background:#fff;border:1px solid #dbe4f0;border-radius:12px;padding:13px;display:block;width:100%}.caseitem.sel{border-color:#3669ea;background:#edf3ff}.caseitem b{display:block}.chip{display:inline-block;border-radius:99px;padding:4px 9px;font-size:11px;background:#eaf0f8;color:#34516f;text-transform:capitalize}.chip.ai{background:#e8e9ff;color:#3a49b2}.chip.queued{background:#fff0d7;color:#87520d}.chip.assigned{background:#e2f5eb;color:#196746}.chip.resolved{background:#edf1f6;color:#65778f}.chat{display:flex;flex-direction:column;height:min(70vh,760px);min-height:400px}.chat-head{border-bottom:1px solid #e4eaf2;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.messages{flex:1;overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:11px}.bubble{background:#eff3fa;border-radius:14px;padding:10px 14px;max-width:85%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.own{background:#dfeaff;align-self:flex-end}.bubble.system{background:#f1f0ff;color:#55518c;font-size:12px;align-self:center;text-align:center}.bubble small{display:block;color:#718198;font-size:10px;margin-top:6px}.compose{display:flex;gap:8px;padding-top:12px;border-top:1px solid #e3eaf3}.compose input{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.kb-step{border:1px solid #b4c7ed;background:#f3f7ff;padding:14px;border-radius:12px;margin-top:12px}.tablewrap{overflow:auto;background:white;border:1px solid #e0e6f0;border-radius:14px}table{width:100%;border-collapse:collapse;text-align:left;min-width:700px}th,td{padding:13px 15px;border-bottom:1px solid #ebeff5;font-size:13px}th{color:#65758f;background:#f8fafe}.note{padding:12px 15px;background:#fff8e8;border:1px solid #f4dfaf;border-radius:12px;color:#7f602b;margin-bottom:15px}.notice{padding:10px 12px;border-radius:9px;background:#ebf2ff;color:#264e93;margin:12px 0}.error{background:#fdebee;color:#992d3a}.footer{font-size:12px;color:#75849b;padding-top:14px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.active-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#21a574;margin-right:5px}.overlay{position:fixed;inset:0;background:#0c193cab;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:18px;padding:26px;width:min(490px,100%);box-shadow:0 20px 70px #0002}@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px 1fr}.main{padding:17px}.grid2{grid-template-columns:1fr}.list{max-height:210px}.chat{height:60vh}}@media(max-width:620px){.portals{grid-template-columns:1fr}.portal{min-height:155px;padding:22px}.entry h1{margin-top:36px}.top{height:auto;min-height:65px;padding:12px}.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid #e1e8f2;display:flex;overflow:auto;padding:6px;gap:5px}.sidebar button{white-space:nowrap;width:auto;padding:9px 11px}.main{padding:14px}.cards{gap:8px}.card{padding:12px}.metric{font-size:25px}.chat{height:64vh;min-height:360px}.formrow{grid-template-columns:1fr}.topright{font-size:12px}}
</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
/* Public project credentials only; the SERVICE_ROLE key must NEVER be placed here. */
const CONFIG={url:'https://qegoaryhedsttjcnvljz.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlZ29hcnloZWRzdHRqY252bGp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MTU1MzEsImV4cCI6MjEwOTI5MTUzMX0.OQpXIG42O6QgKVC2-Z9-MAoa8hnZlbAexol4LlSrtKw'};
const el=document.getElementById('app');const state={client:null,user:null,me:null,portal:null,tab:'overview',cases:[],profiles:[],articles:[],steps:[],messages:[],attempts:[],selected:null,filter:'all',status:'',alert:'',channels:[],loginType:'field'};
const e=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=d=>d?new Date(d).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}):'—';
const duration=ms=>ms==null?'—':ms<0?'—':Math.floor(ms/3600000)+'h '+String(Math.floor(ms%3600000/60000)).padStart(2,'0')+'m';
const queueMs=c=>c.queued_at?((c.assigned_at?Date.parse(c.assigned_at):c.status==='queued'?Date.now():null)-Date.parse(c.queued_at)):null;
const resolveMs=c=>c.resolved_at?Date.parse(c.resolved_at)-Date.parse(c.created_at):null;
const avg=a=>a.length?duration(a.reduce((s,v)=>s+v,0)/a.length):'—';
const name=id=>state.profiles.find(p=>p.id===id)?.display_name||'Unassigned';
const api=()=>{if(!state.client)throw Error('Supabase is not configured. Open index.html and set CONFIG.');return state.client};
const fail=x=>{state.alert=x.message||String(x);render()};
const showAlert=()=>state.alert?`<div class="notice error" role="alert">${e(state.alert)}</div>`:'';
const btn=(text,func,cls='')=>`<button class="btn ${cls}" onclick="${func}">${text}</button>`;
function home(){el.innerHTML=`<section class="entry"><div class="entry-inner"><div class="brand">◈ resolve.</div><h1>One place for every technical question.</h1><p>Start with guided troubleshooting. Our call centre team can follow every step and step in whenever you need them.</p><div class="portals"><button class="portal" onclick="login('field')"><div style="font-size:28px">▣</div><b>Field Login</b><span>Ask a question, follow solutions and chat with Technical Support.</span></button><button class="portal" onclick="login('staff')"><div style="font-size:28px">◉</div><b>Call Centre Login</b><span>Monitor troubleshooting, take over conversations and manage the queue.</span></button></div><p class="small">Secure access requires an approved account. Account creation is controlled by the manager.</p></div></section>`}
function login(type){state.loginType=type;el.innerHTML=`<div class="authpage"><form class="authcard" onsubmit="signIn(event)"><div class="brand">◈ resolve.</div><h2 style="margin-top:26px">${type==='field'?'Field login':'Call centre login'}</h2><p class="muted small">Sign in with your assigned username and password.</p>${showAlert()}<label>Username</label><input id="username" required autocomplete="username" placeholder="Employee ID or username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><div style="height:22px"></div><button class="btn full" type="submit">Sign in</button><button class="btn alt full" type="button" style="margin-top:9px" onclick="state.alert='';home()">Back to home</button><p class="footer">Your access rights are verified by the server.</p></form></div>`}
async function signIn(ev){ev.preventDefault();state.alert='';try{const username=document.getElementById('username').value.trim().toLowerCase();const password=document.getElementById('password').value;const {data,error}=await api().auth.signInWithPassword({email:username+'@resolve-login.invalid',password});if(error)throw error;state.user=data.user;await initSession();if(state.loginType==='field'&&state.me.role!=='field'||state.loginType==='staff'&&state.me.role==='field'){await api().auth.signOut();state.user=null;state.me=null;throw Error('This account cannot use this portal.');}}catch(err){fail(err)}}
async function initSession(){const {data,error}=await api().from('profiles').select('*').eq('id',state.user.id).single();if(error||!data?.enabled){await api().auth.signOut();throw Error('Account not authorised or disabled.')}state.me=data;state.portal=data.role==='field'?'field':'staff';if(data.must_change_password){passwordModal();return}await refresh(true);subscribe();}
function passwordModal(){el.innerHTML=`<div class="authpage"><form class="authcard" onsubmit="changePassword(event)"><h2>Secure your account</h2><p class="muted">You must change your temporary password before using Resolve.</p>${showAlert()}<label>New password (12+ characters)</label><input type="password" id="newpw" minlength="12" required><label>Confirm password</label><input type="password" id="newpw2" minlength="12" required><div style="height:18px"></div><button class="btn full">Update password</button></form></div>`}
async function changePassword(ev){ev.preventDefault();try{const p=document.getElementById('newpw').value;if(p!==document.getElementById('newpw2').value)throw Error('Passwords do not match');if(p.length<12)throw Error('Use at least 12 characters');const {error}=await api().auth.updateUser({password:p});if(error)throw error;const r=await api().rpc('change_my_password_completed');if(r.error)throw r.error;state.me.must_change_password=false;await refresh(true);subscribe()}catch(err){fail(err);passwordModal()}}
async function refresh(draw=true){try{if(!state.me||state.me.must_change_password)return;const c=api();const [cs,ps,as,ss]=await Promise.all([c.from('cases').select('*').order('created_at',{ascending:false}).limit(1000),c.from('profiles').select('id,username,display_name,role,enabled,agent_state,max_chats,available_since,can_monitor,can_takeover,can_reassign').order('display_name'),c.from('articles').select('*').order('title'),c.from('article_steps').select('*').order('ordinal')]);for(const r of [cs,ps,as,ss])if(r.error)throw r.error;state.cases=cs.data||[];state.profiles=ps.data||[];state.articles=as.data||[];state.steps=ss.data||[];if(state.selected&&!state.cases.some(x=>x.id===state.selected))state.selected=null;if(!state.selected&&state.cases.length)state.selected=state.cases[0].id;await loadSelected(false);if(draw)render()}catch(err){state.alert=err.message;render()}}
async function loadSelected(draw=true){if(!state.selected){state.messages=[];state.attempts=[];return}const [m,a]=await Promise.all([api().from('messages').select('*').eq('case_id',state.selected).order('created_at'),api().from('step_attempts').select('*').eq('case_id',state.selected)]);if(m.error)throw m.error;if(a.error)throw a.error;state.messages=m.data||[];state.attempts=a.data||[];if(draw)render()}
function subscribe(){state.channels.forEach(ch=>api().removeChannel(ch));state.channels=[];const ch=api().channel('resolve-refresh-'+state.user.id).on('postgres_changes',{event:'*',schema:'public',table:'cases'},()=>refresh()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>refresh()).subscribe();state.channels=[ch]}
async function logout(){try{if(state.me?.role==='agent')await api().rpc('set_my_presence',{p_state:'offline'});await api().auth.signOut()}catch{}state.channels.forEach(ch=>api().removeChannel(ch));Object.assign(state,{user:null,me:null,portal:null,selected:null,cases:[],messages:[],alert:''});home()}
function header(){return `<header class="top"><div class="brand">◈ resolve.</div><div class="topright"><span class="muted">${e(state.me.display_name)} · ${e(state.me.role)}</span>${btn('Sign out','logout()','alt sm')}</div></header>`}
function nav(){const tabs=state.me.role==='field'?[['conversations','My conversations'],['new','New request']]:[['overview','Overview'],['inbox','Live conversations'],['team','Agent team'],...(state.me.role==='manager'?[['reports','Reports & exports'],['accounts','Account management']]:[])];return `<aside class="sidebar">${tabs.map(([id,title])=>`<button class="${state.tab===id?'active':''}" onclick="state.tab='${id}';render()">${title}</button>`).join('')}</aside>`}
function render(){if(!state.me){if(state.loginType)login(state.loginType);else home();return}if(state.me.must_change_password){passwordModal();return}if(state.portal==='field'&&!['new','conversations'].includes(state.tab))state.tab='conversations';if(state.portal==='staff'&&!['overview','inbox','team','reports','accounts'].includes(state.tab))state.tab='overview';let content='';if(state.tab==='new')content=newRequest();else if(state.tab==='conversations'||state.tab==='inbox')content=inbox();else if(state.tab==='overview')content=overview();else if(state.tab==='team')content=team();else if(state.tab==='reports')content=reports();else if(state.tab==='accounts')content=accounts();el.innerHTML=`<div class="shell">${header()}<div class="layout">${nav()}<main class="main">${showAlert()}${content}<div class="footer">Resolve · Protected by Supabase authentication and database policies · Times shown in your browser's timezone</div></main></div></div>`;const msgs=document.getElementById('messages');if(msgs)msgs.scrollTop=msgs.scrollHeight}
function newRequest(){return `<div class="pagehead"><div><h2>Ask Technical Support</h2><p class="muted">The assistant will guide you through known fixes first.</p></div></div><div class="card" style="max-width:680px"><form onsubmit="createCase(event)"><label>What do you need help with?</label><textarea id="subject" required maxlength="300" placeholder="Describe the issue or enter an error code"></textarea><label>Related troubleshooting topic</label><select id="article"><option value="">No matching topic — speak to support</option>${state.articles.filter(a=>a.active).map(a=>`<option value="${a.id}">${e(a.title)}</option>`).join('')}</select><div class="note small" style="margin-top:18px">Select the closest topic. If none applies, the request will be passed to the call centre. Do not send passwords, customer personal information or security codes in chat.</div><button class="btn">Start conversation</button></form></div>`}
async function createCase(ev){ev.preventDefault();try{const subject=document.getElementById('subject').value.trim();const aid=document.getElementById('article').value;const r=await api().rpc('create_case',{p_subject:subject,p_article_id:aid||null});if(r.error)throw r.error;state.selected=r.data;await refresh(false);if(!aid){const q=await api().rpc('escalate_case',{p_case_id:r.data});if(q.error)throw q.error;await refresh(false)}state.tab='conversations';render()}catch(err){fail(err)}}
function caseList(){let cases=state.cases;if(state.filter!=='all')cases=cases.filter(c=>c.status===state.filter);return `<div class="card"><div class="pagehead"><b>Conversations (${cases.length})</b><select style="max-width:130px" onchange="state.filter=this.value;render()"><option value="all" ${state.filter==='all'?'selected':''}>All</option>${['ai','queued','assigned','resolved'].map(s=>`<option ${s===state.filter?'selected':''} value="${s}">${s}</option>`).join('')}</select></div><div class="list">${cases.length?cases.map(c=>`<button class="caseitem ${state.selected===c.id?'sel':''}" onclick="selectCase('${c.id}')"><b>${e(c.subject)}</b><div class="small muted" style="margin:7px 0">${e(state.me.role==='field'?'My request':name(c.field_id))} · ${fmt(c.created_at)}</div><span class="chip ${c.status}">${c.status}</span> ${c.assigned_to?`<span class="small muted">${e(name(c.assigned_to))}</span>`:''}</button>`).join(''):'<p class="muted small">No conversations found.</p>'}</div></div>`}
async function selectCase(id){state.selected=id;await loadSelected()}
function currentStep(c){if(!c||c.status!=='ai')return null;const steps=state.steps.filter(s=>s.article_id===c.article_id);return steps.find(s=>!state.attempts.some(a=>a.step_id===s.id))||null}
function chatPanel(){const c=state.cases.find(x=>x.id===state.selected);if(!c)return `<div class="card">Choose a conversation to view its details.</div>`;const isField=state.me.role==='field';const canReply=c.status!=='resolved'&&(isField||state.me.role==='manager'||c.assigned_to===state.me.id);const step=currentStep(c);const canTake= !isField&&c.status!=='resolved'&&c.assigned_to!==state.me.id&&(state.me.role==='manager'||state.me.can_takeover)&&c.status!=='assigned';const canResolve=!isField&&c.status!=='resolved'&&(state.me.role==='manager'||c.assigned_to===state.me.id);return `<div class="card chat"><div class="chat-head"><div><b>${e(c.subject)}</b><div class="small muted">${e(name(c.field_id))} · ${e(name(c.assigned_to))} · <span class="chip ${c.status}">${c.status}</span></div></div><div class="actions">${canTake?btn('Take over',`takeover('${c.id}')`,'sm'):''}${!isField&&state.me.role==='manager'&&c.status!=='resolved'?btn('Reassign',`reassignPrompt('${c.id}')`,'alt sm'):''}${canResolve?btn('Resolve',`resolvePrompt('${c.id}')`,'soft sm'):''}</div></div><div class="messages" id="messages">${state.messages.map(m=>`<div class="bubble ${m.author_id===state.me.id?'own':''} ${m.author_kind==='system'?'system':''}"><div>${e(m.body)}</div><small>${m.author_kind==='system'?'Troubleshooting':e(name(m.author_id))} · ${fmt(m.created_at)}</small></div>`).join('')}</div>${isField&&step?`<div class="kb-step"><div class="small muted">GUIDED TROUBLESHOOTING · STEP ${state.steps.filter(s=>s.article_id===c.article_id).findIndex(s=>s.id===step.id)+1}</div><p>${e(step.instructions)}</p><div class="actions">${btn('This solved it',`tryStep('${c.id}','${step.id}',true)`,'sm')}${btn('Still not working',`tryStep('${c.id}','${step.id}',false)`,'alt sm')}</div></div>`:''}${isField&&c.status==='ai'?`<div class="actions" style="padding-top:10px">${btn('Request a human agent',`escalate('${c.id}')`,'soft sm')}</div>`:''}${c.status==='queued'?`<div class="notice small">Waiting for an available call centre agent · Queue time: ${duration(queueMs(c))}</div>`:''}${canReply?`<form class="compose" onsubmit="sendMessage(event)"><input id="chattext" placeholder="Type a message…" maxlength="10000" required aria-label="Message"><button class="btn" type="submit">Send</button></form>`:`<p class="muted small">${c.status==='resolved'?'This conversation is closed.':'Monitoring only. Take over to reply.'}</p>`}</div>`}
function inbox(){return `<div class="pagehead"><h2>${state.me.role==='field'?'My support requests':'Live support conversations'}</h2>${state.me.role==='field'?btn('New request',"state.tab='new';render()",'sm'):btn('Refresh',"refresh()",'alt sm')}</div><div class="grid2">${caseList()}${chatPanel()}</div>`}
async function callRpc(fn,args){try{const r=await api().rpc(fn,args);if(r.error)throw r.error;state.alert='';await refresh()}catch(err){fail(err)}}
function sendMessage(ev){ev.preventDefault();const v=document.getElementById('chattext').value.trim();if(v)callRpc('post_message',{p_case_id:state.selected,p_body:v})}
function tryStep(id,sid,solved){callRpc('try_step',{p_case_id:id,p_step_id:sid,p_solved:solved})}
function escalate(id){callRpc('escalate_case',{p_case_id:id})}
function takeover(id){callRpc('takeover_case',{p_case_id:id})}
function resolvePrompt(id){const n=prompt('Resolution note (required):');if(n!==null)callRpc('resolve_case',{p_case_id:id,p_resolution:n})}
function reassignPrompt(id){const agents=state.profiles.filter(p=>p.role==='agent'&&p.enabled);const txt=agents.map(p=>p.username+': '+p.display_name).join('\n');const target=prompt('Enter agent username:\n'+txt);if(!target)return;const p=agents.find(a=>a.username.toLowerCase()===target.toLowerCase().trim());if(!p){alert('Unknown agent');return}callRpc('reassign_case',{p_case_id:id,p_agent_id:p.id})}
function overview(){const cs=state.cases;const waiting=cs.filter(c=>c.status==='queued');const agent=state.me.role==='agent';return `<div class="pagehead"><div><h2>Call centre overview</h2><p class="muted">${agent?'Monitor AI conversations and handle assigned requests.':'Live view of Technical Support.'}</p></div><div class="toolbar">${agent?`<select style="max-width:170px" onchange="setPresence(this.value)">${['offline','available','busy'].map(x=>`<option value="${x}" ${state.me.agent_state===x?'selected':''}>${x}</option>`).join('')}</select>`:''}${btn('Refresh','refresh()','alt sm')}</div></div><div class="cards"><div class="card"><span class="muted small">AI assisting</span><div class="metric">${cs.filter(c=>c.status==='ai').length}</div></div><div class="card"><span class="muted small">Waiting in queue</span><div class="metric">${waiting.length}</div></div><div class="card"><span class="muted small">With an agent</span><div class="metric">${cs.filter(c=>c.status==='assigned').length}</div></div><div class="card"><span class="muted small">Resolved</span><div class="metric">${cs.filter(c=>c.status==='resolved').length}</div></div></div><div class="grid2"><div class="card"><h3>Agent availability</h3>${state.profiles.filter(p=>p.role==='agent').map(p=>`<div style="padding:9px 0;border-bottom:1px solid #eef2f7"><b>${e(p.display_name)}</b><span class="muted small" style="float:right">${e(p.agent_state)} · ${cs.filter(c=>c.assigned_to===p.id&&c.status==='assigned').length}/${p.max_chats}</span></div>`).join('')}</div><div class="card"><h3>Oldest waiting conversations</h3>${waiting.sort((a,b)=>a.queued_at.localeCompare(b.queued_at)).slice(0,8).map(c=>`<div style="padding:10px 0;border-bottom:1px solid #eef2f7"><b>${e(c.subject)}</b><span style="float:right" class="small muted">${duration(queueMs(c))}</span></div>`).join('')||'<p class="muted">No one is waiting.</p>'}<div style="margin-top:16px">${btn('Open all conversations',"state.tab='inbox';render()",'soft')}</div></div></div>`}
async function setPresence(s){try{const r=await api().rpc('set_my_presence',{p_state:s});if(r.error)throw r.error;state.me.agent_state=s;await refresh()}catch(err){fail(err)}}
function team(){const ps=state.profiles.filter(p=>p.role==='agent');const manager=state.me.role==='manager';return `<div class="pagehead"><h2>Agent team · ${ps.length} accounts</h2></div><div class="tablewrap"><table><thead><tr><th>Agent</th><th>Username</th><th>Availability</th><th>Active chats</th><th>Capacity</th>${manager?'<th>Permissions</th>':''}</tr></thead><tbody>${ps.map(p=>`<tr><td><b>${e(p.display_name)}</b>${!p.enabled?' · disabled':''}</td><td>${e(p.username)}</td><td><span class="chip">${e(p.agent_state)}</span></td><td>${state.cases.filter(c=>c.status==='assigned'&&c.assigned_to===p.id).length}</td><td>${p.max_chats}</td>${manager?`<td>${btn('Configure',`configureAgent('${p.id}')`,'alt sm')}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function configureAgent(id){const p=state.profiles.find(x=>x.id===id);if(!p)return;el.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><form class="modal" onsubmit="saveAgent(event,'${id}')"><h2>${e(p.display_name)}</h2><p class="muted small">Permissions are verified by the database.</p><label>Maximum simultaneous chats</label><input type="number" id="maxchats" min="1" max="20" value="${p.max_chats}" required><label><input type="checkbox" id="enabled" style="width:auto" ${p.enabled?'checked':''}> Account enabled</label><label><input type="checkbox" id="monitor" style="width:auto" ${p.can_monitor?'checked':''}> Monitor all AI conversations</label><label><input type="checkbox" id="takeover" style="width:auto" ${p.can_takeover?'checked':''}> Take over AI conversations</label><label><input type="checkbox" id="reassign" style="width:auto" ${p.can_reassign?'checked':''}> Reassign conversations</label><div class="actions" style="margin-top:18px"><button type="submit" class="btn">Save settings</button>${btn('Cancel',"document.getElementById('overlay').remove()",'alt')}</div></form></div>`)}
async function saveAgent(ev,id){ev.preventDefault();const obj={p_id:id,p_enabled:document.getElementById('enabled').checked,p_max_chats:Number(document.getElementById('maxchats').value),p_monitor:document.getElementById('monitor').checked,p_takeover:document.getElementById('takeover').checked,p_reassign:document.getElementById('reassign').checked};document.getElementById('overlay').remove();callRpc('admin_update_agent',obj)}
function reports(){if(state.me.role!=='manager')return '';const cs=state.cases;const queued=cs.map(queueMs).filter(x=>x!=null&&x>=0),resolved=cs.map(resolveMs).filter(x=>x!=null&&x>=0);return `<div class="pagehead"><div><h2>Reporting & exports</h2><p class="muted">Operational timings and complete chat transcripts</p></div><div class="actions">${btn('Export summary CSV','exportSummary()','alt sm')}${btn('Export transcripts CSV','exportTranscripts()','sm')}</div></div><div class="cards"><div class="card"><span class="small muted">Conversations</span><div class="metric">${cs.length}</div></div><div class="card"><span class="small muted">Average queue wait</span><div class="metric" style="font-size:24px">${avg(queued)}</div></div><div class="card"><span class="small muted">Average resolution time</span><div class="metric" style="font-size:24px">${avg(resolved)}</div></div><div class="card"><span class="small muted">Resolved</span><div class="metric">${resolved.length}</div></div></div><div class="note">Time definitions: queue wait = time from escalation to agent assignment; resolution time = time from case creation to closure. Open cases have no resolution duration. Reports show the latest 1,000 conversations in the live dashboard; exports fetch all records page by page.</div><div class="tablewrap"><table><thead><tr><th>Created</th><th>Issue</th><th>Field</th><th>Agent</th><th>Status</th><th>Queue wait</th><th>Resolution</th></tr></thead><tbody>${cs.slice(0,200).map(c=>`<tr><td>${fmt(c.created_at)}</td><td>${e(c.subject)}</td><td>${e(name(c.field_id))}</td><td>${e(name(c.assigned_to))}</td><td><span class="chip ${c.status}">${c.status}</span></td><td>${duration(queueMs(c))}</td><td>${duration(resolveMs(c))}</td></tr>`).join('')}</tbody></table></div>`}
const csv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';function downloadCsv(filename,rows){const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function allRows(table,order='created_at'){const result=[];for(let i=0;;i++){const r=await api().from(table).select('*').order(order).range(i*500,(i+1)*500-1);if(r.error)throw r.error;result.push(...r.data);if(r.data.length<500)break;}return result}
async function exportSummary(){try{const cases=await allRows('cases');const rows=[['ID','Created','Field username','Subject','Article ID','Status','Assigned agent','Queued at','Assigned at','Resolved at','Queue wait seconds','Resolution seconds','Resolution note'],...cases.map(c=>[c.id,c.created_at,state.profiles.find(p=>p.id===c.field_id)?.username,c.subject,c.article_id,c.status,name(c.assigned_to),c.queued_at,c.assigned_at,c.resolved_at,queueMs(c)==null?'':Math.round(queueMs(c)/1000),resolveMs(c)==null?'':Math.round(resolveMs(c)/1000),c.resolution])];downloadCsv('resolve-conversations-'+new Date().toISOString().slice(0,10)+'.csv',rows)}catch(err){fail(err)}}
async function exportTranscripts(){try{const cases=await allRows('cases');const messages=await allRows('messages','id');const map=new Map(cases.map(c=>[c.id,c]));const rows=[['Case ID','Issue','Case status','Message ID','Timestamp','Sender','Sender type','Message'],...messages.map(m=>[m.case_id,map.get(m.case_id)?.subject,map.get(m.case_id)?.status,m.id,m.created_at,m.author_id?name(m.author_id):'Resolve assistant',m.author_kind,m.body])];downloadCsv('resolve-full-transcripts-'+new Date().toISOString().slice(0,10)+'.csv',rows)}catch(err){fail(err)}}
function accounts(){if(state.me.role!=='manager')return '';return `<div class="pagehead"><h2>Account management</h2></div><div class="grid2"><div class="card"><h3>Create an approved account</h3><p class="muted small">Use the server-side account function. The temporary password must be shared privately and changed on first sign-in.</p><form onsubmit="createAccount(event)"><label>Username / employee ID</label><input id="newuser" required minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+"><label>Full name</label><input id="newname" required><label>Access type</label><select id="newrole"><option value="field">Field employee</option><option value="agent">Call centre agent</option></select><label>Temporary password (12+ characters)</label><input id="temppass" type="password" required minlength="12" autocomplete="new-password"><div style="height:14px"></div><button class="btn">Create account</button></form></div><div class="card"><h3>Existing users</h3><div class="tablewrap"><table style="min-width:400px"><thead><tr><th>Username</th><th>Name</th><th>Role</th></tr></thead><tbody>${state.profiles.map(p=>`<tr><td>${e(p.username)}</td><td>${e(p.display_name)}</td><td>${e(p.role)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Agent settings can be changed in Agent team. Password resets and account removals should be handled through a controlled administrator process.</p></div></div>`}
async function createAccount(ev){ev.preventDefault();try{const username=document.getElementById('newuser').value.trim(),display_name=document.getElementById('newname').value.trim(),role=document.getElementById('newrole').value,password=document.getElementById('temppass').value;const {data,error}=await api().functions.invoke('accounts',{body:{username,display_name,role,password}});if(error)throw error;if(data?.error)throw Error(data.error);state.alert='Account created for '+username+'. Share the temporary password privately.';await refresh()}catch(err){fail(err)}}
(async()=>{try{if(CONFIG.url.startsWith('https://')&&!CONFIG.anon.startsWith('REPLACE_')&&window.supabase){state.client=window.supabase.createClient(CONFIG.url,CONFIG.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data}=await state.client.auth.getSession();if(data.session){state.user=data.session.user;await initSession();return}}}catch(err){state.alert=err.message}home()})();
</script></body></html>
